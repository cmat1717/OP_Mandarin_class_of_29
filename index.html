<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Practice App</title>
    
    <script src="https://google.com" async defer></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; background: #f8fafc; color: #1e293b; font-family: sans-serif; }
        .container { position: relative; width: 100%; max-width: 440px; padding: 30px 22px 22px; background: #fff; border-radius: 20px; box-shadow: 0 12px 30px #0f172a14; }
        .top-controls { position: absolute; top: 14px; right: 14px; display: flex; gap: 10px; align-items: center; }
        .settings-toggle { border: 0; background: transparent; font-size: 22px; cursor: pointer; padding: 0; }
        .auth-btn { background: #4f46e5; color: white; border: 0; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .auth-btn.signed-in { background: #64748b; }
        h1 { margin: 0 0 10px; text-align: center; font-size: 2rem; }
        .subtitle { margin-bottom: 5px; color: #4f46e5; font-weight: 700; text-align: center; }
        .stats-bar { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 18px; font-weight: 700; }
        .api-panel { display: none; margin-bottom: 16px; padding: 12px; border-radius: 12px; background: #f1f5f9; }
        .api-panel label { display: block; margin-bottom: 8px; color: #64748b; font-size: 12px; font-weight: 700; }
        .api-input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .api-input-group input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .api-input-group button { padding: 10px 12px; border: 0; border-radius: 8px; background: #0f172a; color: white; cursor: pointer; }
        .card { margin-bottom: 18px; padding: 18px 14px; border: 1px solid #e2e8f0; border-radius: 12px; }
        .prompt-text { min-height: 28px; font-size: 20px; font-weight: 700; text-align: center; }
        .camera-container { position: relative; display: none; width: 100%; margin-bottom: 18px; overflow: hidden; border-radius: 12px; background: #000; }
        video { display: block; width: 100%; max-height: 300px; }
        .capture-btn { position: absolute; left: 10px; bottom: 10px; width: calc(100% - 20px); padding: 10px 12px; border: 0; border-radius: 8px; background: #0009; color: white; cursor: pointer; }
        .snapshot-preview { display: none; width: 100%; margin-bottom: 18px; border-radius: 12px; }
        .input-area { position: relative; margin-bottom: 18px; }
        .input-area input { width: 100%; padding: 14px 50px 14px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 18px; text-align: center; }
        .camera-trigger { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); border: 0; background: transparent; font-size: 20px; cursor: pointer; }
        .main-btn { display: block; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #4f46e5; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
        #nextBtn { display: none; margin-top: 12px; background: #1e293b; }
        .feedback { display: none; margin-top: 20px; padding: 15px; border-radius: 12px; font-weight: 600; }
        .feedback.correct { border: 1px solid #a7f3d0; background: #ecfdf5; color: #065f46; }
        .feedback.incorrect { border: 1px solid #fca5a5; background: #fef2f2; color: #991b1b; }
    </style>
</head>
<body>
        <main class="container">
        <!-- This adds the Sign In Button and settings side-by-side -->
        <div class="top-controls">
            <button id="authBtn" class="auth-btn" type="button" onclick="handleAuthClick()">Sign In</button>
            <button class="settings-toggle" type="button" onclick="toggleSettings()" aria-label="Settings">⚙️</button>
        </div>
        <h1>Translate to Chinese</h1>
        <div class="subtitle">Random Worksheet Sentences</div>
        
        <!-- This adds the Score display container -->
        <div id="statsBar" class="stats-bar">Score: 0</div>

        <div id="apiPanel" class="api-panel">
            <label for="clientIdInput">GOOGLE CLIENT ID</label>
            <div class="api-input-group">
                <input id="clientIdInput" type="text" placeholder="Get from Google Console...">
                <button type="button" onclick="saveClientId()">Save</button>
            </div>
            <label for="apiKeyInput">GEMINI API KEY</label>
            <div class="api-input-group">
                <input id="apiKeyInput" type="password" placeholder="API key">
                <button type="button" onclick="saveApiKey()">Save</button>
            </div>
        </div>

        <div class="card"><div id="englishPrompt" class="prompt-text">Generating translation task...</div></div>
        <div id="cameraContainer" class="camera-container">
            <video id="videoStream" autoplay playsinline></video>
            <button class="capture-btn" type="button" onclick="captureSnapshot()">Use this photo</button>
        </div>
        <img id="snapshotPreview" class="snapshot-preview" alt="Captured answer preview">
        <div class="input-area">
            <input id="userInput" type="text" placeholder="Type translation..." autocomplete="off">
            <button id="cameraBtn" class="camera-trigger" type="button" onclick="initiateCamera()" aria-label="Use camera">📷</button>
        </div>
        <button id="actionBtn" class="main-btn" type="button" onclick="checkAnswer()">Check Answer</button>
        <button id="nextBtn" class="main-btn" type="button" onclick="loadSentence()">Next Sentence ➡️</button>
        <div id="feedbackBox" class="feedback" aria-live="polite"></div>
    </main>
    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run";

        let currentTarget = { english: "", chinese: "" };
        let localStream = null;
        let capturedImageBase64 = null;
        let tokenClient = null;
        let accessToken = null;
        
        let progress = {
            totalCorrect: 0
        };

        const subjects = [
            { eng: "I", ch: "我", pluralEng: "We", pluralCh: "我们" },
            { eng: "You", ch: "你", pluralEng: "You all", pluralCh: "你们" },
            { eng: "He", ch: "他", pluralEng: "They (men)", pluralCh: "他们" },
            { eng: "She", ch: "她", pluralEng: "They (women)", pluralCh: "她们" }
        ];
        const identities = [{ eng: "teacher", ch: "老师" }, { eng: "classmate", ch: "同学" }, { eng: "friend", ch: "朋友" }];
        const languages = [{ eng: "English", ch: "英语" }, { eng: "French", ch: "法语" }, { eng: "Chinese", ch: "中文" }];

        const pick = (items) => items[Math.floor(Math.random() * items.length)];

        function generateRandomSentence() {
            const subject = pick(subjects);
            const plural = Math.random() > 0.5;
            const en = plural ? subject.pluralEng : subject.eng;
            const zh = plural ? subject.pluralCh : subject.ch;
            let english, chinese;
            switch (Math.floor(Math.random() * 5)) {
                case 0: {
                    const person = pick(identities);
                    const negative = Math.random() > 0.5;
                    const question = !negative && Math.random() > 0.5;
                    if (negative) { english = `${en} are not ${person.eng}s.`; chinese = `${zh}不是${person.ch}`; }
                    else if (question) { english = `Is ${en.toLowerCase()} a ${person.eng}?`; chinese = `${zh}是${person.ch}吗`; }
                    else { english = `${en} ${plural ? "are" : "is"} a ${person.eng}.`; chinese = `${zh}是${person.ch}`; }
                    break;
                }
                case 1: {
                    const language = pick(languages);
                    if (Math.random() > 0.5) { english = `Does ${en.toLowerCase()} study ${language.eng}?`; chinese = `${zh}学${language.ch}吗`; }
                    else if (plural && Math.random() > 0.5) { english = `${en} all study ${language.eng}.`; chinese = `${zh}都学${language.ch}`; }
                    else { english = `${en} study ${language.eng}.`; chinese = `${zh}学${language.ch}`; }
                    break;
                }
                case 2:
                    if (Math.random() > 0.5) { english = `Do ${en.toLowerCase()} have friends?`; chinese = `${zh}有朋友吗`; }
                    else if (Math.random() > 0.5) { english = `${en} have friends.`; chinese = `${zh}有朋友`; }
                    else { english = `${en} do not have friends.`; chinese = `${zh}没有朋友`; }
                    break;
                case 3:
                    if (Math.random() < 1 / 3) { english = "Hello!"; chinese = "你好"; }
                    else if (Math.random() < 0.5) { english = "Goodbye, teacher."; chinese = "再见老师"; }
                    else { english = "Goodbye."; chinese = "再见"; }
                    break;
                default:
                    if (Math.random() > 0.5) { english = `${en} ${plural ? "are" : "is"} very good.`; chinese = `${zh}很好`; }
                    else { english = `${en} ${plural ? "are" : "is"} good.`; chinese = `${zh}好`; }
            }
            english = english.replace("I are", "I am").replace("I is", "I am").replace("Does we", "Do we").replace("Does they", "Do they").replace("Is I", "Am I");
            return { english, chinese };
        }

        function updateStatsUI() {
            document.getElementById("statsBar").textContent = `Score: ${progress.totalCorrect}`;
        }

        function toggleSettings() {
            const panel = document.getElementById("apiPanel");
            panel.style.display = panel.style.display === "block" ? "none" : "block";
        }

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (!key) return;
            localStorage.setItem("gemini_api_key", key);
            alert("API key saved.");
            document.getElementById("apiPanel").style.display = "none";
        }

        function saveClientId() {
            const id = document.getElementById("clientIdInput").value.trim();
            if (!id) return;
            localStorage.setItem("google_client_id", id);
            alert("Google Client ID saved.");
            document.getElementById("apiPanel").style.display = "none";
        }
        function initGoogleAuth() {
            const clientId = localStorage.getItem("google_client_id");
            if (!clientId || typeof google === 'undefined') return;

            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: 'https://googleapis.com',
                callback: async (resp) => {
                    if (resp.error) return;
                    accessToken = resp.access_token;
                    const btn = document.getElementById("authBtn");
                    btn.textContent = "Signed In";
                    btn.classList.add("signed-in");
                    await loadProgressFromCloud();
                },
            });
        }

        function handleAuthClick() {
            if (!tokenClient) {
                alert("Please add your Google Client ID inside Settings (⚙️) first!");
                document.getElementById("apiPanel").style.display = "block";
                return;
            }
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }

        async function loadProgressFromCloud() {
            if (!accessToken) return;
            try {
                const listUrl = "https://googleapis.com'";
                const res = await fetch(listUrl, { headers: { Authorization: `Bearer ${accessToken}` } });
                const data = await res.json();
                
                if (data.files && data.files.length > 0) {
                    const fileId = data.files.id;
                    const fileRes = await fetch(`https://googleapis.com{fileId}?alt=media`, {
                        headers: { Authorization: `Bearer ${accessToken}` }
                    });
                    const cloudData = await fileRes.json();
                    if (cloudData && typeof cloudData.totalCorrect === 'number') {
                        progress = cloudData;
                        localStorage.setItem("local_user_progress", JSON.stringify(progress));
                        updateStatsUI();
                    }
                }
            } catch (err) {
                console.error("Failed to load cloud backup:", err);
            }
        }

        async function saveProgressToCloud() {
            localStorage.setItem("local_user_progress", JSON.stringify(progress));
            if (!accessToken) return;
            try {
                const listUrl = "https://googleapis.com'";
                const res = await fetch(listUrl, { headers: { Authorization: `Bearer ${accessToken}` } });
                const data = await res.json();
                
                const meta = { name: "progress.json", parents: ["appDataFolder"] };
                const blob = new Blob([JSON.stringify(progress)], { type: "application/json" });
                const formData = new FormData();
                formData.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
                formData.append("file", blob);

                if (data.files && data.files.length > 0) {
                    const fileId = data.files.id;
                    await fetch(`https://googleapis.com{fileId}?uploadType=multipart`, {
                        method: "PATCH",
                        headers: { Authorization: `Bearer ${accessToken}` },
                        body: formData
                    });
                } else {
                    await fetch("https://googleapis.com", {
                        method: "POST",
                        headers: { Authorization: `Bearer ${accessToken}` },
                        body: formData
                    });
                }
            } catch (err) {
                console.error("Failed backing up progress to Google Drive:", err);
            }
        }
        function stopCamera() {
            if (localStream) {
                localStream.getTracks().forEach((track) => track.stop());
                localStream = null;
            }
        }

        function loadSentence() {
            currentTarget = generateRandomSentence();
            document.getElementById("englishPrompt").textContent = currentTarget.english;
            const input = document.getElementById("userInput");
            input.value = "";
            input.disabled = false;
            input.style.display = "block";
            document.getElementById("cameraBtn").style.display = "block";
            document.getElementById("feedbackBox").style.display = "none";
            document.getElementById("nextBtn").style.display = "none";
            const action = document.getElementById("actionBtn");
            action.style.display = "block";
            action.disabled = false;
            action.textContent = "Check Answer";
            document.getElementById("cameraContainer").style.display = "none";
            document.getElementById("snapshotPreview").style.display = "none";
            capturedImageBase64 = null;
            stopCamera();
        }

        async function initiateCamera() {
            if (!navigator.mediaDevices?.getUserMedia) {
                alert("Camera access is not supported in this browser.");
                return;
            }
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById("videoStream").srcObject = localStream;
                document.getElementById("cameraContainer").style.display = "block";
                document.getElementById("snapshotPreview").style.display = "none";
            } catch (error) {
                console.error("Camera access error:", error);
                alert("Camera access was blocked or unavailable. Check browser permissions.");
            }
        }

        function captureSnapshot() {
            const video = document.getElementById("videoStream");
            if (!video.videoWidth || !video.videoHeight) {
                alert("Camera is not ready yet.");
                return;
            }
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
            capturedImageBase64 = dataUrl.split(",")[1];
            const preview = document.getElementById("snapshotPreview");
            preview.src = dataUrl;
            preview.style.display = "block";
            document.getElementById("userInput").style.display = "none";
            document.getElementById("cameraBtn").style.display = "none";
            document.getElementById("cameraContainer").style.display = "none";
            stopCamera();
        }

        async function checkAnswer() {
            const input = document.getElementById("userInput").value.trim();
            const key = localStorage.getItem("gemini_api_key");
            if (!input && !capturedImageBase64) {
                alert("Please type an answer or capture a photo first!");
                return;
            }
            if (!key) {
                alert("Please provide your API key first!");
                document.getElementById("apiPanel").style.display = "block";
                return;
            }
            const button = document.getElementById("actionBtn");
            button.disabled = true;
            button.textContent = "Grading with AI...";
            document.getElementById("userInput").disabled = true;

            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-3.5-flash" });
                let instruction = `Grade this student's Chinese translation of: "${currentTarget.english}". Expected Chinese meaning: "${currentTarget.chinese}".`;
                if (capturedImageBase64) {
                    instruction += " Evaluate the Chinese answer in the attached image.";
                } else {
                    instruction += ` The student's typed answer is: "${input}".`;
                }
                instruction += ' Judge meaning rather than requiring an exact character-for-character match. Respond only as JSON: {"isCorrect":true,"feedback":"short explanation"}.';

                const contentsPayload = [{ text: instruction }];
                if (capturedImageBase64) {
                    contentsPayload.push({ inlineData: { mimeType: "image/jpeg", data: capturedImageBase64 } });
                }

                const response = await model.generateContent({ contents: [{ role: "user", parts: contentsPayload }] });
                let rawText = response.response.text().trim().replace(/^```(?:json)?\s*|\s*```$/g, "");
                const evaluation = JSON.parse(rawText);

                if (evaluation.isCorrect) {
                    progress.totalCorrect += 1;
                }
                updateStatsUI();
                await saveProgressToCloud();

                const box = document.getElementById("feedbackBox");
                box.className = `feedback ${evaluation.isCorrect ? "correct" : "incorrect"}`;
                box.style.display = "block";
                const heading = evaluation.isCorrect ? "✨ Excellent Job!" : "Keep Practicing!";
                const feedback = String(evaluation.feedback || "");
                box.replaceChildren();
                
                const title = document.createElement("div");
                title.textContent = heading;
                const detail = document.createElement("div");
                detail.style.cssText = "font-weight:500;margin-top:5px;";
                detail.textContent = evaluation.isCorrect ? feedback : `${feedback} (Expected: ${currentTarget.chinese})`;
                box.append(title, detail);
                
                button.style.display = "none";
                document.getElementById("nextBtn").style.display = "block";
            } catch (error) {
                console.error("AI grading error:", error);
                alert("AI grading failed. Please check the API key and try again.");
                button.disabled = false;
                button.textContent = "Check Answer";
                document.getElementById("userInput").disabled = false;
            }
        }

        Object.assign(window, { toggleSettings, saveApiKey, saveClientId, loadSentence, initiateCamera, captureSnapshot, checkAnswer, handleAuthClick });

        window.addEventListener("DOMContentLoaded", () => {
            loadSentence();
            if (localStorage.getItem("gemini_api_key")) document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key");
            if (localStorage.getItem("google_client_id")) document.getElementById("clientIdInput").value = localStorage.getItem("google_client_id");
            
            const savedLocalProgress = localStorage.getItem("local_user_progress");
            if (savedLocalProgress) {
                try {
                    const parsed = JSON.parse(savedLocalProgress);
                    if (parsed && typeof parsed.totalCorrect === 'number') progress = parsed;
                } catch(e) {}
            }
            updateStatsUI();
            setTimeout(initGoogleAuth, 1000);
        });
    </script>
</body>
</html>
