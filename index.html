<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Practice App</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f8fafc; color: #1e293b; font-family: sans-serif; }
    main { width: 100%; max-width: 440px; padding: 24px; background: white; border-radius: 20px; box-shadow: 0 12px 30px #0f172a14; }
    h1, .subtitle, #statsBar { text-align: center; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .subtitle { margin-bottom: 12px; color: #4f46e5; font-weight: 700; }
    #statsBar { margin-bottom: 18px; color: #475569; font-size: 18px; font-weight: 700; }
    .notice { margin-bottom: 16px; padding: 10px; border-radius: 8px; background: #f1f5f9; color: #475569; font-size: 14px; line-height: 1.4; }
    .card { margin-bottom: 18px; padding: 20px 14px; border: 1px solid #e2e8f0; border-radius: 12px; }
    #prompt { font-size: 20px; font-weight: 700; text-align: center; }
    input { width: 100%; margin-bottom: 14px; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 18px; text-align: center; }
    button { display: block; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #4f46e5; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #nextBtn { display: none; margin-top: 12px; background: #1e293b; }
    #feedback { display: none; margin-top: 16px; padding: 14px; border-radius: 10px; font-weight: 600; }
    #feedback.correct { display: block; border: 1px solid #a7f3d0; background: #ecfdf5; color: #065f46; }
    #feedback.incorrect { display: block; border: 1px solid #fca5a5; background: #fef2f2; color: #991b1b; }
  </style>
</head>
<body>
  <main>
    <h1>Translate to Chinese</h1>
    <div class="subtitle">Random Worksheet Sentences</div>
    <div id="statsBar" aria-live="polite">Score: 0</div>
    <div class="notice">Your score is saved on this device. No Google sign-in, API key, or account setup is needed. Answers are checked against the expected translation.</div>
    <div class="card"><div id="prompt">Loading...</div></div>
    <input id="answer" type="text" placeholder="Type your Chinese translation" autocomplete="off" aria-label="Chinese translation">
    <button id="checkBtn" type="button">Check Answer</button>
    <button id="nextBtn" type="button">Next Sentence ➡️</button>
    <div id="feedback" aria-live="polite"></div>
  </main>
  <script>
    const subjects = [
      { eng: "I", ch: "我", pluralEng: "We", pluralCh: "我们" },
      { eng: "You", ch: "你", pluralEng: "You all", pluralCh: "你们" },
      { eng: "He", ch: "他", pluralEng: "They (men)", pluralCh: "他们" },
      { eng: "She", ch: "她", pluralEng: "They (women)", pluralCh: "她们" }
    ];
    const identities = [{ eng: "teacher", ch: "老师" }, { eng: "classmate", ch: "同学" }, { eng: "friend", ch: "朋友" }];
    const languages = [{ eng: "English", ch: "英语" }, { eng: "French", ch: "法语" }, { eng: "Chinese", ch: "中文" }];
    const pick = (items) => items[Math.floor(Math.random() * items.length)];
    let target;
    let score = Number(localStorage.getItem("chinese_practice_score") || 0);
    if (!Number.isFinite(score) || score < 0) score = 0;
    const scoreEl = document.getElementById("statsBar");
    const answerEl = document.getElementById("answer");
    const feedbackEl = document.getElementById("feedback");
    const checkBtn = document.getElementById("checkBtn");
    const nextBtn = document.getElementById("nextBtn");

    function updateScore() {
      scoreEl.textContent = `Score: ${score}`;
      localStorage.setItem("chinese_practice_score", String(score));
    }
    function makeSentence() {
      const subject = pick(subjects);
      const plural = Math.random() > 0.5;
      const en = plural ? subject.pluralEng : subject.eng;
      const zh = plural ? subject.pluralCh : subject.ch;
      let english, chinese;
      switch (Math.floor(Math.random() * 5)) {
        case 0: {
          const person = pick(identities);
          const negative = Math.random() > 0.5;
          const question = !negative && Math.random() > 0.5;
          if (negative) { english = `${en} are not ${person.eng}s.`; chinese = `${zh}不是${person.ch}`; }
          else if (question) { english = `Is ${en.toLowerCase()} a ${person.eng}?`; chinese = `${zh}是${person.ch}吗`; }
          else { english = `${en} ${plural ? "are" : "is"} a ${person.eng}.`; chinese = `${zh}是${person.ch}`; }
          break;
        }
        case 1: {
          const language = pick(languages);
          if (Math.random() > 0.5) { english = `Does ${en.toLowerCase()} study ${language.eng}?`; chinese = `${zh}学${language.ch}吗`; }
          else if (plural && Math.random() > 0.5) { english = `${en} all study ${language.eng}.`; chinese = `${zh}都学${language.ch}`; }
          else { english = `${en} study ${language.eng}.`; chinese = `${zh}学${language.ch}`; }
          break;
        }
        case 2:
          if (Math.random() > 0.5) { english = `Do ${en.toLowerCase()} have friends?`; chinese = `${zh}有朋友吗`; }
          else if (Math.random() > 0.5) { english = `${en} have friends.`; chinese = `${zh}有朋友`; }
          else { english = `${en} do not have friends.`; chinese = `${zh}没有朋友`; }
          break;
        case 3:
          if (Math.random() < 1 / 3) { english = "Hello!"; chinese = "你好"; }
          else if (Math.random() < 0.5) { english = "Goodbye, teacher."; chinese = "再见老师"; }
          else { english = "Goodbye."; chinese = "再见"; }
          break;
        default:
          if (Math.random() > 0.5) { english = `${en} ${plural ? "are" : "is"} very good.`; chinese = `${zh}很好`; }
          else { english = `${en} ${plural ? "are" : "is"} good.`; chinese = `${zh}好`; }
      }
      english = english.replace("I are", "I am").replace("I is", "I am").replace("Does we", "Do we").replace("Does they", "Do they").replace("Is I", "Am I");
      return { english, chinese };
    }
    function loadSentence() {
      target = makeSentence();
      document.getElementById("prompt").textContent = target.english;
      answerEl.value = "";
      answerEl.disabled = false;
      checkBtn.disabled = false;
      checkBtn.style.display = "block";
      nextBtn.style.display = "none";
      feedbackEl.className = "";
      feedbackEl.style.display = "none";
      answerEl.focus();
    }
    function normalize(text) {
      return text.replace(/[\s，。！？、,.!?;；:：]/g, "");
    }
    function checkAnswer() {
      const answer = normalize(answerEl.value.trim());
      if (!answer) { answerEl.focus(); return; }
      const correct = answer === normalize(target.chinese);
      if (correct) {
        score += 1;
        updateScore();
      }
      feedbackEl.className = correct ? "correct" : "incorrect";
      feedbackEl.textContent = correct ? "✨ Correct! Great job!" : `Not quite. Expected answer: ${target.chinese}`;
      feedbackEl.style.display = "block";
      answerEl.disabled = true;
      checkBtn.style.display = "none";
      nextBtn.style.display = "block";
      nextBtn.focus();
    }
    checkBtn.addEventListener("click", checkAnswer);
    nextBtn.addEventListener("click", loadSentence);
    answerEl.addEventListener("keydown", (event) => { if (event.key === "Enter") checkAnswer(); });
    updateScore();
    loadSentence();
  </script>
</body>
</html>
