<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chinese Practice App</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f8fafc;
        color: #1e293b;
        font-family: sans-serif;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 440px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        padding: 30px 22px 22px;
        position: relative;
      }

      .settings-toggle {
        position: absolute;
        top: 14px;
        right: 14px;
        border: none;
        background: transparent;
        font-size: 22px;
        cursor: pointer;
      }

      h1 {
        margin: 0 0 10px;
        text-align: center;
        font-size: 2rem;
      }

      .subtitle {
        text-align: center;
        color: #4f46e5;
        font-weight: 700;
        margin-bottom: 18px;
      }

      .api-panel {
        display: none;
        background: #f1f5f9;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 16px;
        text-align: left;
      }

      .api-panel label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #64748b;
        margin-bottom: 8px;
      }

      .api-input-group {
        display: flex;
        gap: 8px;
      }

      .api-input-group input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
      }

      .api-input-group button {
        background: #0f172a;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
      }

      .card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 18px 14px;
        margin-bottom: 18px;
      }

      .prompt-text {
        font-size: 20px;
        font-weight: 700;
        text-align: center;
        min-height: 28px;
      }

      .camera-container {
        display: none;
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 18px;
        background: #000;
        position: relative;
      }

      video {
        display: block;
        width: 100%;
        max-height: 300px;
        background: #000;
      }

      .capture-btn {
        position: absolute;
        left: 10px;
        bottom: 10px;
        width: calc(100% - 20px);
        background: rgba(0, 0, 0, 0.6);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
      }

      .snapshot-preview {
        display: none;
        width: 100%;
        border-radius: 12px;
        margin-bottom: 18px;
      }

      .input-area {
        position: relative;
        margin-bottom: 18px;
      }

      .input-area input {
        width: 100%;
        padding: 14px 50px 14px 14px;
        font-size: 18px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        text-align: center;
      }

      .camera-trigger {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        font-size: 20px;
        cursor: pointer;
      }

      .main-btn {
        display: block;
        width: 100%;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .main-btn[style*="display:none"] {
        display: none;
      }

      #nextBtn {
        margin-top: 12px;
        background: #1e293b;
      }

      .feedback {
        display: none;
        margin-top: 20px;
        padding: 15px;
        border-radius: 12px;
        font-weight: 600;
        text-align: left;
      }

      .feedback.correct {
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }

      .feedback.incorrect {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button class="settings-toggle" type="button" onclick="toggleSettings()">⚙️</button>

      <h1>Translate to Chinese</h1>
      <div class="subtitle">Random Worksheet Sentences</div>

      <div id="apiPanel" class="api-panel">
        <label for="apiKeyInput">GEMINI API KEY</label>
        <div class="api-input-group">
          <input type="password" id="apiKeyInput" placeholder="AQ..." />
          <button type="button" onclick="saveApiKey()">Save</button>
        </div>
      </div>

      <div class="card">
        <div id="englishPrompt" class="prompt-text">Generating translation task...</div>
      </div>

      <div id="cameraContainer" class="camera-container">
        <video id="videoStream" autoplay playsinline></video>
        <button class="capture-btn" type="button" onclick="captureSnapshot()">Use this photo</button>
      </div>

      <img id="snapshotPreview" class="snapshot-preview" alt="Captured answer preview" />

      <div class="input-area">
        <input id="userInput" type="text" placeholder="Type translation..." autocomplete="off" />
        <button id="cameraBtn" class="camera-trigger" type="button" onclick="initiateCamera()">📷</button>
      </div>

      <button id="actionBtn" class="main-btn" type="button" onclick="checkAnswer()">Check Answer</button>
      <button id="nextBtn" class="main-btn" type="button" onclick="loadSentence()" style="display:none;">Next Sentence ➡️</button>

      <div id="feedbackBox" class="feedback"></div>
    </div>

    <script type="module">
      import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

      const subjects = [
        { eng: "I", ch: "我", pluralEng: "We", pluralCh: "我们" },
        { eng: "You", ch: "你", pluralEng: "You all", pluralCh: "你们" },
        { eng: "He", ch: "他", pluralEng: "They (men)", pluralCh: "他们" },
        { eng: "She", ch: "她", pluralEng: "They (women)", pluralCh: "她们" }
      ];

      const identities = [
        { eng: "teacher", ch: "老师" },
        { eng: "classmate", ch: "同学" },
        { eng: "friend", ch: "朋友" }
      ];

      const languages = [
        { eng: "English", ch: "英语" },
        { eng: "French", ch: "法语" },
        { eng: "Chinese", ch: "中文" }
      ];

      let currentTarget = { english: "", chinese: "" };
      let localStream = null;
      let capturedImageBase64 = null;

      function getRandomElement(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function generateRandomSentence() {
        const sub = getRandomElement(subjects);
        const isPlural = Math.random() > 0.5;
        const subEng = isPlural ? sub.pluralEng : sub.eng;
        const subCh = isPlural ? sub.pluralCh : sub.ch;
        const patternType = Math.floor(Math.random() * 5);
        let eng = "";
        let ch = "";

        switch (patternType) {
          case 0: {
            const id = getRandomElement(identities);
            const isNegative = Math.random() > 0.5;
            const isQuestion = !isNegative && Math.random() > 0.5;

            if (isNegative) {
              eng = `${subEng} are not ${id.eng}s.`;
              ch = `${subCh}不是${id.ch}`;
            } else if (isQuestion) {
              eng = `Is ${subEng.toLowerCase()} a ${id.eng}?`;
              ch = `${subCh}是${id.ch}吗`;
            } else {
              eng = `${subEng} ${isPlural ? "are" : "is"} a ${id.eng}.`;
              ch = `${subCh}是${id.ch}`;
            }
            break;
          }
          case 1: {
            const lang = getRandomElement(languages);
            const usesAll = isPlural && Math.random() > 0.5;
            const languageQuestion = Math.random() > 0.5;

            if (languageQuestion) {
              eng = `Does ${subEng.toLowerCase()} study ${lang.eng}?`;
              ch = `${subCh}学${lang.ch}吗`;
            } else if (usesAll) {
              eng = `${subEng} all study ${lang.eng}.`;
              ch = `${subCh}都学${lang.ch}`;
            } else {
              eng = `${subEng} study ${lang.eng}.`;
              ch = `${subCh}学${lang.ch}`;
            }
            break;
          }
          case 2: {
            const hasFriends = Math.random() > 0.5;
            const possessionQuestion = Math.random() > 0.5;

            if (possessionQuestion) {
              eng = `Do ${subEng.toLowerCase()} have friends?`;
              ch = `${subCh}有朋友吗`;
            } else if (hasFriends) {
              eng = `${subEng} have friends.`;
              ch = `${subCh}有朋友`;
            } else {
              eng = `${subEng} do not have friends.`;
              ch = `${subCh}没有朋友`;
            }
            break;
          }
          case 3: {
            const phraseType = Math.floor(Math.random() * 3);

            if (phraseType === 0) {
              eng = "Hello!";
              ch = "你好";
            } else if (phraseType === 1) {
              eng = "Goodbye, teacher.";
              ch = "再见老师";
            } else {
              eng = "Goodbye.";
              ch = "再见";
            }
            break;
          }
          case 4: {
            const isVery = Math.random() > 0.5;

            if (isVery) {
              eng = `${subEng} ${isPlural ? "are" : "is"} very good.`;
              ch = `${subCh}很好`;
            } else {
              eng = `${subEng} ${isPlural ? "are" : "is"} good.`;
              ch = `${subCh}好`;
            }
            break;
          }
        }

        eng = eng
          .replace("I is a", "I am a")
          .replace("I are a", "I am a")
          .replace("Does we", "Do we")
          .replace("Does they", "Do they")
          .replace("Is I a", "Am I a");

        return { english: eng, chinese: ch };
      }

      function toggleSettings() {
        const panel = document.getElementById("apiPanel");
        if (!panel) return;
        panel.style.display = panel.style.display === "block" ? "none" : "block";
      }

      function saveApiKey() {
        const input = document.getElementById("apiKeyInput");
        if (!input) return;

        const key = input.value.trim();
        if (key) {
          localStorage.setItem("gemini_api_key", key);
          alert("Key saved smoothly!");
          toggleSettings();
        }
      }

      function loadSentence() {
        currentTarget = generateRandomSentence();

        const englishPrompt = document.getElementById("englishPrompt");
        const userInput = document.getElementById("userInput");
        const feedbackBox = document.getElementById("feedbackBox");
        const nextBtn = document.getElementById("nextBtn");
        const actionBtn = document.getElementById("actionBtn");
        const cameraBtn = document.getElementById("cameraBtn");
        const cameraContainer = document.getElementById("cameraContainer");
        const snapshotPreview = document.getElementById("snapshotPreview");

        if (englishPrompt) englishPrompt.textContent = currentTarget.english;
        if (userInput) {
          userInput.value = "";
          userInput.disabled = false;
          userInput.style.display = "block";
        }
        if (cameraBtn) cameraBtn.style.display = "block";
        if (feedbackBox) feedbackBox.style.display = "none";
        if (nextBtn) nextBtn.style.display = "none";
        if (actionBtn) {
          actionBtn.style.display = "block";
          actionBtn.disabled = false;
          actionBtn.textContent = "Check Answer";
        }
        if (cameraContainer) cameraContainer.style.display = "none";
        if (snapshotPreview) snapshotPreview.style.display = "none";

        capturedImageBase64 = null;
        stopCamera();
      }

      async function initiateCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Camera access is not supported in this browser.");
          return;
        }

        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });

          const video = document.getElementById("videoStream");
          const cameraContainer = document.getElementById("cameraContainer");
          const snapshotPreview = document.getElementById("snapshotPreview");

          if (video) {
            video.srcObject = localStream;
          }
          if (cameraContainer) cameraContainer.style.display = "block";
          if (snapshotPreview) snapshotPreview.style.display = "none";
        } catch (err) {
          console.error("Camera access error:", err);
          alert("Camera access was blocked by system permissions.");
        }
      }

      function captureSnapshot() {
        const video = document.getElementById("videoStream");
        const preview = document.getElementById("snapshotPreview");
        const userInput = document.getElementById("userInput");
        const cameraBtn = document.getElementById("cameraBtn");
        const cameraContainer = document.getElementById("cameraContainer");

        if (!video || !video.videoWidth || !video.videoHeight) {
          alert("Camera is not ready yet.");
          return;
        }

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
        capturedImageBase64 = dataUrl.split(",")[1];

        if (preview) {
          preview.src = dataUrl;
          preview.style.display = "block";
        }
        if (userInput) userInput.style.display = "none";
        if (cameraBtn) cameraBtn.style.display = "none";
        if (cameraContainer) cameraContainer.style.display = "none";

        stopCamera();
      }

      function stopCamera() {
        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
          localStream = null;
        }
      }

      async function checkAnswer() {
        const input = document.getElementById("userInput")?.value.trim() || "";
        const target = currentTarget.english;
        const expected = currentTarget.chinese;
        const key = localStorage.getItem("gemini_api_key");

        if (!input && !capturedImageBase64) {
          alert("Please type an answer or capture a photo first!");
          return;
        }

        if (!key) {
          alert("Please provide your API key first!");
          toggleSettings();
          return;
        }

        const btn = document.getElementById("actionBtn");
        const userInput = document.getElementById("userInput");

        if (btn) {
          btn.disabled = true;
          btn.textContent = "Grading with AI...";
        }
        if (userInput) userInput.disabled = true;

        try {
          const genAI = new GoogleGenerativeAI(key);
          const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

          let instruction = `Grade this student's translation. English target: "${target}". Expected Chinese meaning: "${expected}".`;

          if (capturedImageBase64) {
            instruction += " The student is submitting an image answer. Judge whether the handwritten or photographed answer matches the target meaning.";
          } else {
            instruction += ` The student typed: "${input}". Judge whether the typed answer matches the target meaning.`;
          }

          instruction += ` Respond ONLY with raw valid JSON using this schema: { "isCorrect": true or false, "feedback": "short explanation" }.`;

          const payload = capturedImageBase64
            ? {
                contents: [
                  {
                    role: "user",
                    parts: [
                      { text: instruction },
                      { inlineData: { mimeType: "image/jpeg", data: capturedImageBase64 } }
                    ]
                  }
                ]
              }
            : {
                contents: [
                  {
                    role: "user",
                    parts: [{ text: instruction }]
                  }
                ]
              };

          const result = await model.generateContent(payload);
          let rawText = result.response.text().trim();

          if (rawText.includes("```")) {
            rawText = rawText.replace(/```json|```/g, "").trim();
          }

          const evaluation = JSON.parse(rawText);
          const box = document.getElementById("feedbackBox");
          const nextBtn = document.getElementById("nextBtn");

          if (box) {
            box.style.display = "block";
          }
          if (nextBtn) nextBtn.style.display = "block";
          if (btn) btn.style.display = "none";

          if (evaluation.isCorrect) {
            box.className = "feedback correct";
            box.innerHTML = `<div>✨ Excellent Job!</div><div style="font-weight:500;margin-top:5px;">${evaluation.feedback}</div>`;
          } else {
            box.className = "feedback incorrect";
            box.innerHTML = `<div>Keep Practicing!</div><div style="font-weight:500;margin-top:5px;">${evaluation.feedback} (Expected: ${expected})</div>`;
          }
        } catch (error) {
          console.error("AI grading error:", error);
          alert("AI grading error. Loading a new target sentence.");
          loadSentence();
        }
      }

      window.onload = function () {
        loadSentence();
        const savedKey = localStorage.getItem("gemini_api_key");
        const apiKeyInput = document.getElementById("apiKeyInput");
        if (savedKey && apiKeyInput) apiKeyInput.value = savedKey;
      };
    </script>
  </body>
</html>
