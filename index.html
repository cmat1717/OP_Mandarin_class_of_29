<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Practice App</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; color: #1e293b; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 420px; width: 100%; text-align: center; position: relative; }
    .settings-toggle { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; }
    .api-panel { background: #f1f5f9; border-radius: 12px; padding: 12px; margin-bottom: 20px; display: none; text-align: left; }
    .api-input-group { display: flex; gap: 8px; margin-top: 5px; }
    .api-input-group input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .prompt-text { font-size: 20px; font-weight: 700; }
    .input-area { position: relative; margin-bottom: 20px; }
    input[type="text"] { width: 100%; padding: 14px 40px 14px 14px; font-size: 18px; border: 2px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; text-align: center; }
    .camera-trigger { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 18px; cursor: pointer; }
    .camera-container { display: none; width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 20px; background: #000; position: relative; }
    video { width: 100%; display: block; }
    .snapshot-preview { display: none; width: 100%; border-radius: 10px; margin-bottom: 20px; }
    button.main-btn { background: #4f46e5; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; }
    .feedback { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; font-weight: 600; text-align: left; }
    .correct { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .incorrect { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>
  <div class="container">
    <button class="settings-toggle" id="toggleSettingsBtn">⚙️</button>
    <h1>Translate to Chinese</h1>
    <div style="color:#6366f1; margin-bottom:20px; font-weight:600;">Random Worksheet Sentences</div>
    
    <div id="apiPanel" class="api-panel">
      <label style="font-size:12px; font-weight:700; color:#64748b;">GEMINI API KEY</label>
      <div class="api-input-group">
        <input type="password" id="apiKeyInput" placeholder="AQ...">
        <button id="saveApiKeyBtn" style="padding:8px 12px; border-radius:6px; background:#0f172a; color:white; border:none;">Save</button>
      </div>
    </div>

    <div class="card">
      <div class="prompt-text" id="englishPrompt">Generating translation task...</div>
    </div>

    <div id="cameraContainer" class="camera-container">
      <video id="videoStream" autoplay playsinline></video>
      <button id="captureSnapshotBtn" style="position:absolute; bottom:10px; left:10px; width:calc(100% - 20px); background:rgba(0,0,0,0.6); color:white; border:none; padding:8px; border-radius:6px;">📸 Take Photo</button>
    </div>

    <img id="snapshotPreview" class="snapshot-preview" alt="Preview">

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type translation..." autocomplete="off">
      <button class="camera-trigger" id="cameraBtn">📷</button>
    </div>

    <button id="actionBtn" class="main-btn">Check Answer</button>
    <button id="nextBtn" class="main-btn" style="display:none; background:#1e293b;">Next Sentence ➡️</button>

    <div id="feedbackBox" class="feedback"></div>
  </div>

  <!-- FIXED: Clean import map loading Google's modern AQ-compatible engine -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh"
      }
    }
  </script>
  <!-- FIXED: Script initialized as type="module" to load app.js parameters natively -->
  <script type="module" src="app.js?v=4"></script>
</body>
</html>
